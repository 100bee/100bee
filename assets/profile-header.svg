      100BEE
    </text>

    <!-- Top Right: Interests -->
    <text
      x="1152"
      y="44"
      text-anchor="end"
      fill="#526071"
      font-family="'Courier New', monospace"
      font-size="13"
      letter-spacing="1.2"
    >
      SOFTWARE / AI / MLOPS / DATA / INFRA
    </text>

    <!-- Top Divider -->
    <path
      d="M48 65H1152"
      fill="none"
      stroke="#DEE4ED"
    />

    <!-- Name -->
    <text
      x="44"
      y="165"
      fill="#111827"
      font-size="88"
      font-weight="700"
      letter-spacing="-4.5"
    >
      Jiseok Jung.
    </text>

    <!-- Role -->
    <text
      x="48"
      y="217"
      fill="#2563EB"
      font-size="34"
      font-weight="500"
      letter-spacing="-0.9"
