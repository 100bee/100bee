      Software Engineer
    </text>

    <!-- Right Divider -->
    <path
      d="M858 95V232"
      fill="none"
      stroke="#DEE4ED"
    />

    <!-- 100BEE Monogram -->
    <text
      x="1012"
      y="177"
      text-anchor="middle"
      fill="#2563EB"
      font-size="116"
      font-weight="800"
      letter-spacing="-9"
